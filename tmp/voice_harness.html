<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    window.__voiceTest = { runtimeClicks: 0, nativePlayResolved: false, pauseCalls: 0 };
    const nativePause = HTMLMediaElement.prototype.pause;
    HTMLMediaElement.prototype.pause = function (...args) {
      window.__voiceTest.pauseCalls += 1;
      return nativePause.apply(this, args);
    };
  </script>
  <script src="../assets/accessible-tts.js?v=7"></script>
</head>
<body>
  <main id="content">
    <h1>Place value</h1>
    <p>Read every word in this paragraph.</p>
    <table><tr><th>Digit</th><th>Value</th></tr><tr><td>4</td><td>Four ones</td></tr></table>
    <input aria-label="Answer" value="">
  </main>
  <button type="button" aria-label="Activate text to speech">Voice</button>
  <script>
    document.addEventListener('click', (event) => {
      if (event.target.closest('[aria-label="Activate text to speech"]')) window.__voiceTest.runtimeClicks += 1;
    });
    const detached = new Audio('missing.mp3');
    detached.play().then(() => { window.__voiceTest.nativePlayResolved = true; });
    window.setInterval(() => {
      window.__voiceTest.narrationText = window.ADTAccessibleTTS.sanitizeForSpeech(
        window.ADTAccessibleTTS.extractPageText()
      );
      document.body.dataset.test = JSON.stringify(window.__voiceTest);
    }, 50);
  </script>
</body>
</html>
