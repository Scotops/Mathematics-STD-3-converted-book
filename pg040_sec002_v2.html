      <img data-id="pg040_im003" src="images/pg040_im003.png" alt="Example 3 illustration" class="absolute inset-0 h-full w-full rounded-[22px] object-cover opacity-0 pointer-events-none" style="max-width: 100%; height: auto;">
      <div class="absolute left-10 top-0 -translate-y-1/2 rounded-2xl bg-gradient-to-b from-yellow-500 to-yellow-700 px-5 py-2 shadow-lg max-lg:left-8 max-sm:left-4">
        <div data-id="pg040_n0023" class="text-left text-2xl font-extrabold tracking-wide text-white max-lg:text-xl max-sm:text-lg">Example 3</div>
      </div>

      <div class="relative z-10 space-y-3 text-left text-[#2f2a2a]">
        <div data-id="pg040_n0024" class="text-[28px] leading-snug max-lg:text-2xl max-sm:text-xl">Fill in the missing numbers in the following sequence:</div>
        <div data-id="pg040_n0025_dashes" class="text-[30px] leading-snug max-lg:text-2xl max-sm:text-xl">25, 23, 21, ___, ___</div>
        <div data-id="pg040_n0026" class="pt-1 text-[32px] font-extrabold leading-none max-lg:text-3xl max-sm:text-2xl">Solution</div>
        <p class="text-[28px] leading-snug max-lg:text-2xl max-sm:text-xl"><span data-id="pg040_n0028">This sequence shows that the numbers decrease by 2 in each step.</span></p>
        <div data-id="pg040_n0029" class="text-[28px] leading-snug max-lg:text-2xl max-sm:text-xl">Thus,</div>

        <div class="pt-1">
          <table class="ml-6 border-2 border-yellow-700 text-left text-[28px] leading-none text-[#2f2a2a] max-lg:ml-4 max-sm:ml-0 max-lg:text-2xl max-sm:text-xl">
            <tr class="border-b border-yellow-700">
              <td data-id="pg040_n0033" class="min-w-[210px] px-6 py-2 max-sm:min-w-0">25 - 2 = 23</td>
            </tr>
            <tr class="border-b border-yellow-700">
              <td data-id="pg040_n0036" class="px-6 py-2">23 - 2 = 21</td>
            </tr>
            <tr class="border-b border-yellow-700">
              <td data-id="pg040_n0039" class="px-6 py-2">21 - 2 = 19</td>
            </tr>
            <tr>
              <td data-id="pg040_n0042" class="px-6 py-2">19 - 2 = 17</td>
            </tr>
          </table>
        </div>

        <div data-id="pg040_n0043" class="pt-1 text-[28px] leading-snug max-lg:text-2xl max-sm:text-xl">Therefore, the answer is 25, 23, 21, 19, 17.</div>
      </div>
